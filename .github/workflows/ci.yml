name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The suite drives a real Chromium (Stagehand's localBrowser + playwright-core).
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build # build first: four tests shell out to dist/cli.js
      - run: npm test
