<!doctype html>
<meta charset="utf-8">
<title>Checkout</title>
<style>
  :root { --bg:#0b0f17; --chrome:#1b2436; --card:#ffffff; --ink:#0f1420; --muted:#6b7280;
          --line:#e5e7eb; --brand:#4f46e5; --green:#16a34a; --greenbg:#ecfdf3;
          --red:#dc2626; --redbg:#fef2f2; --netbg:#0f1420; --netfg:#e6edf6; --dim:#93a1b5; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         display:flex; align-items:center; justify-content:center; }
  .win { width:920px; background:#fff; border-radius:12px; overflow:hidden;
         box-shadow:0 24px 80px rgba(0,0,0,.55); border:1px solid #223; }
  .chrome { height:44px; background:var(--chrome); display:flex; align-items:center; gap:8px; padding:0 14px; }
  .dot{ width:12px;height:12px;border-radius:50% } .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .url { margin-left:12px; flex:1; background:#0f1420; color:#93a1b5; font:13px ui-monospace,monospace;
         padding:6px 12px; border-radius:6px; }
  .page { display:grid; grid-template-columns:1.4fr 1fr; }
  .cart { padding:34px 36px; color:var(--ink); }
  .cart h1 { font-size:22px; margin-bottom:4px; }
  .cart .sub { color:var(--muted); font-size:14px; margin-bottom:24px; }
  .item { display:flex; justify-content:space-between; padding:14px 0; border-top:1px solid var(--line); font-size:15px; }
  .item .name b { display:block; } .item .name span { color:var(--muted); font-size:13px; }
  .total { display:flex; justify-content:space-between; padding:16px 0 22px; border-top:2px solid var(--ink);
           margin-top:6px; font-size:18px; font-weight:700; }
  .btn { width:100%; padding:15px; border:0; border-radius:10px; background:var(--brand); color:#fff;
         font-size:16px; font-weight:600; cursor:pointer; }
  .ok { margin-top:16px; padding:14px 16px; border-radius:10px; background:var(--greenbg); color:var(--green);
        font-size:16px; font-weight:600; opacity:0; transition:opacity .25s; }
  .ok.show { opacity:1; }
  /* network monitor — the channel the user never sees */
  .net { background:var(--netbg); color:var(--netfg); padding:22px 20px; font:13px ui-monospace,monospace; }
  .net .h { color:var(--dim); text-transform:uppercase; letter-spacing:.08em; font-size:11px; margin-bottom:14px; }
  .net .row { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid #1f2937; opacity:0; transform:translateY(4px);
              transition:opacity .2s, transform .2s; }
  .net .row.show { opacity:1; transform:none; }
  .net .m { color:#7ab0ff; } .net .p { color:#e6edf6; flex:1; }
  .net .s200 { color:#4ade80; } .net .s500 { color:#ff6b78; font-weight:700; }
  .cursor { position:fixed; width:22px; height:22px; z-index:9; pointer-events:none;
            left:0; top:0; transition:left .9s cubic-bezier(.4,.1,.2,1), top .9s cubic-bezier(.4,.1,.2,1); }
  .cursor svg { filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .cursor.click svg { transform:scale(.82); }
</style>
<div class="win">
  <div class="chrome"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <div class="url">https://shop.example/checkout</div></div>
  <div class="page">
    <div class="cart">
      <h1>Checkout</h1>
      <div class="sub">One item · ships tomorrow</div>
      <div class="item"><div class="name"><b>Deluxe Widget</b><span>SKU 4242 · qty 1</span></div><div>$49.00</div></div>
      <div class="total"><div>Total</div><div>$49.00</div></div>
      <button class="btn" id="place">Place order</button>
      <div class="ok" id="ok">✅ Order placed — confirmation #4242</div>
    </div>
    <div class="net">
      <div class="h">network</div>
      <div class="row" id="netrow"><span class="m">POST</span><span class="p">/submit</span><span class="s500" id="status">—</span></div>
      <div style="color:#5b6472;margin-top:14px;font-size:12px" id="netnote"></div>
    </div>
  </div>
</div>
<div class="cursor" id="cur"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="#fff" stroke="#0b0f17" stroke-width="1.3" d="M4 2l14 8-6 1.5L15 18l-2.5 1L9 12l-5 2z"/></svg></div>
<script>
const cur = document.getElementById('cur');
const wait = ms => new Promise(r=>setTimeout(r,ms));
async function moveTo(el){
  const r = el.getBoundingClientRect();
  cur.style.left = (r.left + r.width*0.5) + 'px';
  cur.style.top  = (r.top + r.height*0.5) + 'px';
  await wait(950);
}
(async () => {
  cur.style.left = '80px'; cur.style.top = '520px';
  await wait(700);
  await moveTo(document.getElementById('place'));
  cur.classList.add('click'); await wait(140); cur.classList.remove('click');
  // the real request — the recorder's server returns 500
  let status = 500;
  try { const res = await fetch('/submit', { method:'POST' }); status = res.status; } catch(e){ status = 0; }
  // the UI shows success regardless — the optimistic-UI bug
  document.getElementById('ok').classList.add('show');
  await wait(500);
  // reveal the network truth
  const st = document.getElementById('status');
  st.textContent = status || 'failed';
  st.className = status>=200 && status<300 ? 's200' : 's500';
  document.getElementById('netrow').classList.add('show');
  document.getElementById('netnote').textContent = 'server rejected the write. the page never said so.';
  await wait(2200);
  window.__demoDone = true;
})();
</script>
