<!doctype html>
<meta charset="utf-8">
<title>TrueFact demo</title>
<style>
  :root { --bg:#0b0f17; --panel:#111827; --bar:#1b2436; --fg:#e6edf6; --dim:#93a1b5;
          --green:#4ade80; --red:#ff6b78; --amber:#fbbf47; --prompt:#7ab0ff; --accent:#a99bff; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); display:flex; align-items:center; justify-content:center;
         font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; }
  .term { width:920px; background:var(--panel); border-radius:12px; overflow:hidden;
          box-shadow:0 24px 80px rgba(0,0,0,.55); border:1px solid #1c2434; }
  .bar { height:40px; background:var(--bar); display:flex; align-items:center; gap:8px;
         padding:0 16px; border-bottom:1px solid #1c2434; }
  .dot { width:12px; height:12px; border-radius:50%; }
  .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .bar .name { margin-left:12px; color:var(--dim); font-size:13px; letter-spacing:.3px; }
  .body { padding:22px 24px 26px; font-size:17px; line-height:1.7; min-height:360px; }
  .line { white-space:pre-wrap; }
  .prompt { color:var(--prompt); }
  .dim { color:var(--dim); }
  .green { color:var(--green); }
  .red { color:var(--red); }
  .amber { color:var(--amber); }
  .cursor { display:inline-block; width:10px; height:19px; background:var(--fg);
            transform:translateY(3px); animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .hidden { display:none; }
  .tag { margin-top:18px; color:var(--dim); font-size:15px; }
  .tag b { color:var(--accent); font-weight:600; }
</style>
<div class="term">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="name">truefact — checkout run</span></div>
  <div class="body" id="body"></div>
</div>
<script>
// The whole demo, as a timeline of lines. `t` = ms to wait before showing.
// Output blocks are the REAL output of `truefact assert` on a recorded run.
const steps = [
  { t:400,  html:'<span class="dim"># the page showed ✅. so did the agent. ask the world instead:</span>' },
  { type:'$ truefact assert checkout.jsonl --with assertions.mjs', t:600 },
  { t:900,  html:'<span class="red">FAIL  #4  act: click the \'Place order\' button</span>' },
  { t:120,  html:'          <span class="dim">a request failed behind this step</span>' },
  { t:350,  html:'<span class="red">FAIL  #7  act: click the \'Place order\' button</span>' },
  { t:120,  html:'          <span class="dim">a request failed behind this step</span>' },
  { t:500,  html:'' },
  { t:120,  html:'<span class="amber">1/3 write steps pass  (2 failed)</span>' },
  { t:600,  html:'<span class="prompt">$</span> <span class="dim">echo exit=$?</span>' },
  { t:250,  html:'<span class="red">exit=1</span>  <span class="dim"># CI fails on the lie the agent told</span>' },
  { t:900,  html:'<div class="tag">The agent said <b>done</b>. The server returned <b>500</b>. '
                +'TrueFact caught it — deterministically, no LLM.</div>' },
];
const body = document.getElementById('body');
const wait = ms => new Promise(r => setTimeout(r, ms));
function addLine(html){ const d=document.createElement('div'); d.className='line'; d.innerHTML=html; body.appendChild(d); return d; }
async function typeLine(text){
  const d=addLine('<span class="prompt">$</span> ');
  const cur=document.createElement('span'); cur.className='cursor'; d.appendChild(cur);
  for(const ch of text.replace(/^\$ /,'')){ cur.insertAdjacentText('beforebegin',ch); await wait(38); }
  cur.remove();
}
(async () => {
  for(const s of steps){
    await wait(s.t);
    if(s.type) await typeLine(s.type); else addLine(s.html);
  }
  await wait(1400);
  window.__demoDone = true;   // recorder stops here
})();
</script>
